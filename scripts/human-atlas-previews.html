<!doctype html>
<meta charset="utf-8">
<title>Human Atlas model preview renderer</title>
<style>body { margin: 0; background: #f8f4ed; } canvas { width: 720px; height: 720px; }</style>
<!-- Serve the repository root locally; call renderAtlasPreview(id) in a browser.
     This is a build helper, not a public application route. -->
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(720, 720);
renderer.setPixelRatio(1);
renderer.setClearColor('#f8f4ed');
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#fffaf0', '#9d887e', 2.4));
const key = new THREE.DirectionalLight('#fff8ef', 3.2); key.position.set(-3, 5, 7); scene.add(key);
const fill = new THREE.DirectionalLight('#e2ecff', 1.8); fill.position.set(5, 1, -3); scene.add(fill);
const camera = new THREE.PerspectiveCamera(32, 1, .01, 100);
camera.position.set(0, .2, 8.4); camera.lookAt(0, 0, 0);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
let current;
window.renderAtlasPreview = async (id) => {
  if (!/^[a-z0-9-]+$/.test(id)) throw new Error('Invalid model ID');
  if (current) {
    scene.remove(current);
    current.traverse(n => { if (n.isMesh) { n.geometry.dispose(); for (const m of [].concat(n.material)) m.dispose(); } });
  }
  const gltf = await loader.loadAsync(`/public/models/${id}.glb`);
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const scale = 3.8 / Math.max(...box.getSize(new THREE.Vector3()).toArray());
  model.scale.setScalar(scale);
  model.position.copy(box.getCenter(new THREE.Vector3()).multiplyScalar(-scale));
  current = new THREE.Group(); current.add(model); current.rotation.set(.05, -.28, 0); scene.add(current);
  renderer.render(scene, camera);
  const organ = renderer.domElement.toDataURL('image/webp', .92).split(',')[1];
  const thumb = document.createElement('canvas'); thumb.width = 180; thumb.height = 180;
  const context = thumb.getContext('2d'); context.imageSmoothingQuality = 'high';
  context.drawImage(renderer.domElement, 0, 0, 180, 180);
  return { organ, thumb: thumb.toDataURL('image/webp', .9).split(',')[1], meshes: gltf.scene.getObjectsByProperty('isMesh', true).length };
};
window.previewReady = true;
</script>
